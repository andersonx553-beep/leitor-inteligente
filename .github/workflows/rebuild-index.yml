name: Build Leitor Inteligente

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".payload/**"
      - ".github/workflows/rebuild-index.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild index.html
        shell: bash
        run: |
          set -euo pipefail
          cat .payload/part-* > /tmp/app.xz.b64
          base64 -d /tmp/app.xz.b64 > /tmp/app.html.xz
          xz -dc /tmp/app.html.xz > index.html
          test "$(wc -c < index.html)" -eq 531239
          echo "d11989d930c2d8c8239bafc2f9a7b56c96935c8e08281e8ec0e5b6d29f5acadc  index.html" | sha256sum -c -

      - name: Commit final app and clean temporary files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm -r .payload
          git rm .github/workflows/rebuild-index.yml
          git commit -m "Deploy Leitor Inteligente"
          git push
